<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRW Rentals - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* LOGIN BOX */

.login-container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

.login-container h1{
    text-align:center;
    margin-bottom:10px;
    color:#111;
}

.login-container p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

/* INPUTS */

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.input-group input:focus{
    border-color:#111;
}

/* BUTTON */

.btn{
    width:100%;
    padding:14px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    background:#333;
}

/* LINKS */

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:13px;
}

.links a{
    color:#111;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

/* SIGNUP TEXT */

.signup-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
    color:#666;
}

.signup-text a{
    color:#111;
    font-weight:bold;
    text-decoration:none;
}

.signup-text a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-container">

    <h1>Welcome Back</h1>
    <p>Login to continue booking luxury rides</p>

    <form>

        <div class="input-group">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn">Login</button>

    </form>

    <div class="links">
        <a href="#">Forgot Password?</a>
    </div>

    <div class="signup-text">
        Don't have an account? <a href="#">Sign Up</a>
    </div>

</div>

</body>
</html>
