<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRW Rentals - Sign Up</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* SIGN UP BOX */

.signup-container{
    width:100%;
    max-width:450px;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

.signup-container h1{
    text-align:center;
    margin-bottom:10px;
    color:#111;
}

.signup-container p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

/* FORM */

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.input-group input:focus{
    border-color:#111;
}

/* BUTTON */

.btn{
    width:100%;
    padding:14px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    background:#333;
}

/* TEXT */

.login-link{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    color:#666;
}

.login-link a{
    color:#111;
    font-weight:bold;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="signup-container">

    <h1>Create Account</h1>
    <p>Sign up to book luxury vehicles with RRW Rentals</p>

    <form>

        <div class="input-group">
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-group">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <input type="tel" placeholder="Phone Number" required>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="btn">Sign Up</button>

    </form>

    <div class="login-link">
        Already have an account? <a href="#">Login</a>
    </div>

</div>

</body>
</html>
